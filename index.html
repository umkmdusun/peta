<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto</title>
<style>
  :root {
    --bg-color: #111111;
    --text-color: #e8e8e8;
    --caption-color: #9a9a9a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .frame {
    max-width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  img {
    max-width: 100%;
    max-height: 80vh;
    width: auto;
    height: auto;
    display: block;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }

  img.zoomed {
    max-height: none;
    max-width: none;
    width: auto;
    transform: scale(1.4);
    cursor: zoom-out;
  }

  .caption {
    font-size: 14px;
    color: var(--caption-color);
    text-align: center;
  }

  body.zoom-active {
    overflow: auto;
    display: block;
    padding: 40px;
  }
  body.zoom-active .frame {
    min-height: calc(100vh - 80px);
    justify-content: center;
  }
</style>
</head>
<body>

  <div class="frame">
    <img id="photo" src="foto.png" alt="Deskripsi foto" onclick="toggleZoom()">
    <p class="caption">PETA ADMINISTRASI DUSUN PESU</p>
  </div>

  <script>
    function toggleZoom() {
      const img = document.getElementById('photo');
      img.classList.toggle('zoomed');
      document.body.classList.toggle('zoom-active');
    }
  </script>

</body>
</html>
